<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Đăng nhập trang quản trị CatSocial" />
  <title>Đăng nhập quản trị - CatSocial</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/login.css" />
</head>
<body>
  <nav>
    <a href="./index.html" class="logo">Cat<span>Social</span></a>
  </nav>

  <main class="page-body">
    <section class="login-card" aria-labelledby="adminLoginTitle">
      <h1 class="login-card-title" id="adminLoginTitle">Đăng nhập quản trị</h1>
      <p class="login-card-sub">Dành cho tài khoản quản trị CatSocial</p>

      <form id="adminLoginForm" novalidate>
        <div class="form-control">
          <input type="email" id="adminEmail" name="email" required autocomplete="username" placeholder=" " />
          <label for="adminEmail">Email</label>
        </div>

        <div class="form-control">
          <input type="password" id="adminPassword" name="password" required autocomplete="current-password" placeholder=" " />
          <label for="adminPassword">Mật khẩu</label>
          <button type="button" class="toggle-pw" aria-label="Hiện mật khẩu">
            <i class="fa-regular fa-eye" id="pw-icon"></i>
          </button>
        </div>

        <div class="form-help">
          <span></span>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-lock"></i>
          Đăng nhập quản trị
        </button>
      </form>

      <div class="divider"><span>hoặc tiếp tục với</span></div>

      <div class="social-btns admin-social-btns">
        <button type="button" class="btn-social google">
          <i class="fa-brands fa-google"></i> Google
        </button>
      </div>

      <p class="card-footer-text"><a href="./login.html">Quay lại đăng nhập người dùng</a></p>
      <p class="card-footer-text"><a href="./index.html">Về trang chủ</a></p>
    </section>
  </main>

  <footer>CatSocial</footer>

  <script type="module" src="./script/admin-login.js"></script>
  <script>
    const toggleButton = document.querySelector('.toggle-pw');
    const passwordInput = document.getElementById('adminPassword');
    const passwordIcon = document.getElementById('pw-icon');

    toggleButton.addEventListener('click', () => {
      const hidden = passwordInput.type === 'password';
      passwordInput.type = hidden ? 'text' : 'password';
      passwordIcon.className = hidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
      toggleButton.setAttribute('aria-label', hidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    });
  </script>
</body>
</html>
